## /etc/nginx/sites-available/veerifyapp.com
##
## Copy this file to /etc/nginx/sites-available/veerifyapp.com, then:
##   sudo ln -s /etc/nginx/sites-available/veerifyapp.com \
##              /etc/nginx/sites-enabled/veerifyapp.com
##   sudo nginx -t          # dry-run — catches typos before reload
##   sudo systemctl reload nginx
##
## Routing summary:
##   veerifyapp.com/                       → public landing (this new build)
##   veerifyapp.com/privacy-policy         → public legal
##   veerifyapp.com/terms-and-conditions   → public legal
##   veerifyapp.com/refund-cancellation-policy → public legal
##   veerifyapp.com/child-safety           → public legal
##   veerifyapp.com/account-deletion       → public legal
##   veerifyapp.com/contact                → public legal
##   veerifyapp.com/admin                  → existing admin dashboard
##   veerifyapp.com/admin/*                → existing admin (SPA routes)
##   veerifyapp.com/api/*                  → Express backend on :5000
##   veerifyapp.com/uploads/*              → Express backend static files
##
## SPA refresh handling: try_files ... /index.html catches every path
## that isn't a real file and hands it to React Router. This is what
## makes "refresh on /privacy-policy" work — nginx serves the SPA
## bundle, React Router matches the path, page renders. No 404s.
##
## Assumes:
##   • Public build lives at   /var/www/veerify-public/dist
##   • Admin  build lives at   /var/www/veerify-admin/dist  (unchanged)
##   • Backend runs on         127.0.0.1:5000  (unchanged)
##   • SSL certs from Let's Encrypt at the standard path.

# ── HTTP → HTTPS redirect ─────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name veerifyapp.com www.veerifyapp.com;
    return 301 https://veerifyapp.com$request_uri;
}

# ── www → apex redirect over HTTPS ────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.veerifyapp.com;

    ssl_certificate     /etc/letsencrypt/live/veerifyapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veerifyapp.com/privkey.pem;

    return 301 https://veerifyapp.com$request_uri;
}

# ── Main server block ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name veerifyapp.com;

    # ── SSL (Let's Encrypt / certbot managed) ─────────────────────
    ssl_certificate     /etc/letsencrypt/live/veerifyapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veerifyapp.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ── Security headers (Play Store review appreciates these) ────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # Permissive-enough CSP for the public bundle. Admin bundle can override
    # in its own location block if it needs more (e.g. Razorpay checkout).
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self'" always;

    # ── Gzip everything reasonable ────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ── Uploaded assets (student photos, invoice PDFs) ────────────
    # Served BEFORE the /api catch-all so nginx doesn't hand them to
    # the backend when it can just stream them from disk. The Express
    # backend also serves /uploads, so this location is an
    # optimisation — comment it out if the backend does any auth on
    # /uploads URLs.
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # PDFs and images can cache aggressively — they're immutable
        # (each invoice / photo has a unique filename).
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── API — Express backend ────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-poll / webhook endpoints need generous timeouts.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Preserve the raw body so the Razorpay webhook signature
        # verification (which reads req.rawBody) works correctly.
        proxy_request_buffering off;
    }

    # ── Admin dashboard ──────────────────────────────────────────
    # Serves the existing admin SPA from its own dist folder. The
    # try_files rule hands any non-file path inside /admin to the
    # admin's index.html so React Router can resolve /admin/login,
    # /admin/dashboard, etc., across page refreshes.
    location /admin {
        alias /var/www/veerify-admin/dist;
        try_files $uri $uri/ /admin/index.html;

        # Static asset caching (Vite outputs hashed filenames)
        location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Public site (default / everything else) ──────────────────
    # Landing + legal pages. try_files hands every non-file path to
    # index.html so React Router resolves /privacy-policy,
    # /account-deletion, etc. across refreshes.
    root /var/www/veerify-public/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # Cache the HTML shell for zero seconds — new deploys need to
        # be visible immediately.
        location = /index.html {
            expires 0;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # But cache the hashed asset bundle aggressively.
        location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
